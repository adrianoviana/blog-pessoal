<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <!-- Email envelope icon with modern design -->
  <g transform="translate(150, 80)">
    <!-- Envelope body -->
    <rect x="0" y="40" width="300" height="180" rx="8" fill="#f7fafc" stroke="#2b6cb0" stroke-width="3"/>

    <!-- Envelope flap -->
    <path d="M 0 40 L 150 140 L 300 40" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0 40 L 150 140 L 300 40 L 300 60 L 150 160 L 0 60 Z" fill="#2b6cb0" opacity="0.1"/>

    <!-- AI Circuit pattern -->
    <circle cx="80" cy="140" r="8" fill="#2b6cb0" opacity="0.3"/>
    <circle cx="150" cy="160" r="10" fill="#2b6cb0" opacity="0.4"/>
    <circle cx="220" cy="140" r="8" fill="#2b6cb0" opacity="0.3"/>

    <line x1="80" y1="140" x2="150" y2="160" stroke="#2b6cb0" stroke-width="2" opacity="0.3"/>
    <line x1="150" y1="160" x2="220" y2="140" stroke="#2b6cb0" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="100" cy="150" r="4" fill="#2b6cb0" opacity="0.2"/>
  <circle cx="500" cy="180" r="6" fill="#2b6cb0" opacity="0.2"/>
  <circle cx="520" cy="120" r="3" fill="#2b6cb0" opacity="0.2"/>
  <circle cx="80" cy="200" r="5" fill="#2b6cb0" opacity="0.2"/>
</svg>
